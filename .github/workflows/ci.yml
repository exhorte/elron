name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_code
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alx
          POSTGRES_PASSWORD: alx
          POSTGRES_DB: alx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alx -d alx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://alx:alx@localhost:5432/alx_test
      DATABASE_URL: postgres://alx:alx@localhost:5432/alx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 04_code/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

# Base PostgreSQL locale de développement/test. Identifiants volontairement triviaux :
# ils ne servent qu'en local (port 5433 exposé sur la machine de développement).
name: alx

services:
  db:
    image: postgres:16-alpine
    # Développement et tests UNIQUEMENT : sans fsync, les TRUNCATE de la suite de tests sont ~3× plus rapides.
    # Une panne de courant peut corrompre cette base locale (jetable) ; ne jamais reprendre ces options en production.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: alx
      POSTGRES_PASSWORD: alx
      POSTGRES_DB: alx
    ports:
      - "5433:5432"
    volumes:
      - alx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alx -d alx"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  alx_pgdata:
